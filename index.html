---
layout: default
---
<div class="home">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    </li>
    {% endfor %}
  </ul>
</div>
